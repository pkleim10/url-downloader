name: Siphon
options:
  bundleIdPrefix: com.machiilabs
  deploymentTarget:
    macOS: "26.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

targets:
  Siphon:
    type: application
    platform: macOS
    sources:
      - path: Siphon
        excludes:
          - "**/.DS_Store"
      # Per-site configurations shared with the web version; copied into Resources/sites
      - path: ../sites
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.machiilabs.siphon
        PRODUCT_NAME: Siphon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "41"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_CFBundleDisplayName: Siphon
        INFOPLIST_KEY_CFBundleName: Siphon
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Mach II Labs. Siphon is free."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Siphon/Siphon.entitlements
        DEVELOPMENT_TEAM: "99DA5P7M35"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5"
        ENABLE_TESTABILITY: "YES"
        ENABLE_PREVIEWS: "YES"
    info:
      path: Siphon/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Mach II Labs. Siphon is free."
  SiphonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SiphonTests
    dependencies:
      - target: Siphon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.machiilabs.siphon.tests
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: "99DA5P7M35"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Siphon.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Siphon"
        BUNDLE_LOADER: "$(TEST_HOST)"
